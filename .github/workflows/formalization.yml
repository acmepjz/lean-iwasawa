name: Formalization metadata and comparison

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install check-jsonschema
      - run: >-
          check-jsonschema
          --schemafile https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/v0.4.schema.json
          formalization.yaml

  comparator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Install comparator sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build trusted shared dependencies and comparison modules
        working-directory: IwasawalibCFT
        run: lake build Challenge Solution
      - name: Audit module headers and source lengths
        run: python3 scripts/audit-lean-sources.py
      - name: Compare the Mathlib-only Iwasawa theorem
        run: scripts/check-comparator.sh
