      tool_setup: "Earlier contributor development, as credited in Git and source headers."
      prompting_notes: "The earlier contributors' complete automation history was not reconstructed."
    - method: "agent"
      models: ["claude-fable-5-1", "claude-opus-5-5"]
      framework: "Claude Code with MechMath Agent Team (MMAT) FL-Prover"
      tool_setup: >-
        Human-directed completion on 2026-09-26 and 2026-09-27, with delegated
        formalization, proof, integration and review tasks; Lean builds,
        declaration checks, axiom audits and blueprint checks.
      prompting_notes: >-
        Complete the existing EonMath/lean-iwasawa development, preserve the
