        declarations and publish the cleaned development.
      cost:
        wall_time: "Not measured; recorded work spans 2026-09-26–2026-09-27."
        spend_usd: "Unknown; launch budget limits are not actual expenditure."
    - method: "agent"
      framework: "Codex"
      tool_setup: "Provenance reconstruction and Comparator interface preparation in November 2026."
      prompting_notes: "Recover relevant Claude Code history, follow the official metadata specification, and configure comparison of the existing results."
  notes: >-
    Model strings are literal identifiers in the recovered session records,
    not inferred product names. The recovery covers the September completion
    phase and does not establish the tool use of every earlier contributor.
    See docs/formalization-history.md for session identifiers and milestones.
fidelity:
  divergences: >-
    The class-number formula uses multiplicity p of the class number and
    natural mu, lambda with integer nu, for all n above a threshold. The
    general extension structure is specialized by Unique on the index type.
    The cyclotomic result additionally supplies an extension as a witness.
    The unconditional results discharge both Hilbert class field propositions
    by formal proofs. Comparator preserves their existing statements; it
    does not itself certify correspondence to the informal literature.
review:
  status: "agent-reviewed"
  notes: >-
    Historical Claude Code records report statement-preservation review,
    builds and axiom audits. The nested package was rebuilt successfully
    during metadata preparation; its existing axiom guards allow only the
    three standard axioms listed above. Independent human mathematical peer
    review is not asserted. On 2026-11-09, both endpoints passed full
    Comparator statement comparison, the standard-axiom allowlist check,
    and Lean kernel replay under real Landrun with the systemd AF_UNIX
    restriction (exit 0). Nanoda was not enabled. See
    docs/comparator-verification.md for tool revisions and the result.
alignment:
  statements:
    - source: "Washington, Theorem 13.13; Iwasawa, Theorem 11"
      lean: "MvZpExtension.multiplicity_classNumber_Kn_eq₁"
      module: "IwasawalibCFT.Iwasawa"
      status: "proved"
    - source: "Cyclotomic Z_p-extension specialization of the growth theorem"
      lean: "NumberField.exists_cyclotomic_multiplicity_classNumber_eq"
      module: "IwasawalibCFT.Iwasawa"
      status: "proved"
acknowledgements: >-
  Credits follow the blueprint, source headers and Git author identities;
  they do not assign every historical change to a particular person or model.
  This development uses Lean, Mathlib and Naganori Yamaguchi's ClassFieldTheory.
