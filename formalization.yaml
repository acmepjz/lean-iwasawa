version: "v0.4"
project:
  name: "Formalization of Iwasawa Theory in Lean"
  description: >-
    A formal proof of Iwasawa's classical class-number growth theorem.
    For an increasing tower of finite cyclic Galois extensions K_n/K of a
    number field with degrees p^n, the p-adic multiplicity of the class number
    of K_n equals mu*p^n + lambda*n + nu for all sufficiently large n, with
    natural mu and lambda and integer nu. The compared statement uses only
    Mathlib concepts. Its proof constructs the union as a Z_p-extension and
    discharges the Hilbert class field inputs using the external Nyll class
    field theory library. The library also contains the cyclotomic specialization.
    This formalizes a known theorem and makes no claim of a new mathematical result.
  authors:
    - "Jz Pan (acmepjz / acme_pjz)"
    - "caosip"
    - "njw"
    - "pelicanhere"
    - "Nick Adfor"
    - "Pietro Monticone"
    - "Shouxin Zhang"
  responsible_maintainers: ["Jinzhao Pan", "Yichuan Cao", "Jiawei Nie"]
  license: "Apache-2.0"
sources:
  - title: "Introduction to cyclotomic fields"
    authors: ["Lawrence C. Washington"]
    id: "Graduate Texts in Mathematics 83, second edition, Springer, 1997"
    type: "book"
    location: "Chapter 13, Theorem 13.13"
    relationship: "formalizes"
    note: "The principal reference in the blueprint and main theorem docstring."
  - title: "On Gamma-extensions of algebraic number fields"
    authors: ["Kenkichi Iwasawa"]
    id: "Bulletin of the American Mathematical Society 65 (1959), 183–226"
    type: "paper"
    location: "Theorem 11"
    relationship: "formalizes"
    note: "Historical source cited by the blueprint for the growth theorem."
related_formalizations:
  - id: "https://github.com/acmepjz/lean-iwasawa"
    relationship: "builds-on"
    note: "The original Iwasawa development and blueprint credited to Jz Pan and contributors."
  - id: "https://github.com/n-yamaguchi-0729/ClassFieldTheory/tree/b9a2dddbf076eb96b768c333fd828d339ab3d9eb"
    relationship: "builds-on"
    note: >-
      Naganori Yamaguchi's class field theory library supplies the Hilbert
      class field results used by the nested package. Its proof development
      and authorship are separate from the integration work in this repository.
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: "Reuses Mathlib's algebra, number theory, topology, and proof infrastructure."
classification:
  arxiv: ["math.NT"]
  msc2020: ["11R23", "11R37"]
status:
  scope: >-
    The nested IwasawalibCFT package proves the growth theorem for increasing
    cyclic Galois towers with layer degrees p^n using only Mathlib concepts
    in its statement. Comparator checks this single endpoint. Its one
    deliberate Challenge hole is a specification, not an unresolved proof.
    The structure-based theorem and cyclotomic corollary remain library results.
  main_results:
    - declaration: "NumberField.multiplicity_classNumber_eq_of_finrank_eq_pow"
      file: "IwasawalibCFT/IwasawalibCFT/MathlibIwasawa.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "IwasawalibCFT/comparator.json"
    - declaration: "MvZpExtension.multiplicity_classNumber_Kn_eq₁"
      file: "IwasawalibCFT/IwasawalibCFT/Iwasawa.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "NumberField.exists_cyclotomic_multiplicity_classNumber_eq"
      file: "IwasawalibCFT/IwasawalibCFT/Iwasawa.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
