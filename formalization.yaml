fidelity:
  divergences: >-
    The class-number formula uses multiplicity p of the class number and
    natural mu, lambda with integer nu, for all n above a threshold. The
    general extension structure is specialized by Unique on the index type.
    The cyclotomic result additionally supplies an extension as a witness.
    The unconditional results discharge both Hilbert class field propositions
    by formal proofs. The Mathlib-only challenge preserves the upstream
    NumberField.multiplicity_classNumber_eq_of_finrank_eq_pow statement at
    acmepjz/lean-iwasawa revision aef1a74ec13d5a5684367e9c43668fae276c7cd9,
    including its explicit NumberField instances on the layers. The proof
    constructs the union rather than assuming the ambient field is algebraic
    or Galois. Comparator does not itself certify correspondence to literature.
review:
  status: "agent-reviewed"
  notes: >-
    Historical Claude Code records report statement-preservation review,
    builds and axiom audits. The nested package was rebuilt successfully
    during metadata preparation; its existing axiom guards allow only the
    three standard axioms listed above. Independent human mathematical peer
    review is not asserted. The Lean 4.35 migration is being validated;
    the historical results below certify their recorded Lean 4.33 snapshots,
    not the current migration. On 2026-11-10, full Comparator validation of the
    Mathlib-only replacement passed statement comparison, the standard-axiom
    allowlist and Lean kernel replay (exit 0, 11 minutes 32 seconds).
    On 2026-11-09, the two former Comparator endpoints passed full
    Comparator statement comparison, the standard-axiom allowlist check,
    and Lean kernel replay under real Landrun with the systemd AF_UNIX
    restriction (exit 0). Nanoda was not enabled. See
    docs/comparator-mathlib-verification.md for the current result and
    docs/comparator-verification.md for the historical pair of targets.
